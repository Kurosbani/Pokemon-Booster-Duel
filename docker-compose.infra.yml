services:

  registry:
    image: registry:2
    container_name: registry
    ports:
      - "5000:5000"
    volumes:
      - pushed-images:/var/lib/registry
    networks:
      - pokemon-net

  db:
    image: postgres:18.6-alpine3.24
    container_name: pkmn-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./db/db:/docker-entrypoint-initdb.d/db
      - db-data:/var/lib/postgresql
    networks:
      - pokemon-net

  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: pgadmin4
    ports:
     - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    networks:
      - pokemon-net


  server:
    image: maven:4.0.0-rc-7-eclipse-temurin-25-alpine
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - QUARKUS_HTTP_PORT=3000
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://db:5432/pkmn-db
      - QUARKUS_DATASOURCE_USERNAME=kuro
      - QUARKUS_DATASOURCE_PASSWORD=gutespasswort67
    depends_on: {
      db: {
        condition: service_started
      }
    }
    volumes:
      - ./poke-api:/app
      - maven-cache:/root/.m2
    working_dir: /app
    command: ["mvn", "quarkus:dev"]
    restart: unless-stopped
    networks:
      - pokemon-net

  frontend:
    build:
      context: .
      dockerfile: ./src/Dockerfile
    ports: 
      - "8000:8000"
    volumes:
      - ./src:/app/src
    restart: unless-stopped
    networks:
      - pokemon-net


volumes:
  db-data:
  pushed-images:
  maven-cache:

networks:
  pokemon-net: 
    name: pokemon-net
    driver: bridge


#1. `registry`: Image `registry:2` auf Port 5000 mit einem persistenten Docker Volume für gepushte Images.
#2. `db`: Image `postgres:alpine` auf Port 5432 mit einem persistenten Volume für die Pokemon-Daten.
#3. `pgadmin`: Image `dpage/pgadmin4` auf Port 5050 zur Datenbankverwaltung.