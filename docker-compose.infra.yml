services:
  registry:
    image: registry:2
    ports:
      - "5000:5000"
    volumes:
      - pushed-images:/var/lib/registry
    networks:
      - pokemon-net

  db:
    image: postgres:alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pokemon-db
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - pokemon-net

  pgadmin:
    image: dpage/pgadmin4
    ports:
     - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: user@domain.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    networks:
      - pokemon-net

volumes:
  db-data:
  pushed-images:

networks:
  pokemon-net:
    driver: bridge


#1. `registry`: Image `registry:2` auf Port 5000 mit einem persistenten Docker Volume für gepushte Images.
#2. `db`: Image `postgres:alpine` auf Port 5432 mit einem persistenten Volume für die Pokemon-Daten.
#3. `pgadmin`: Image `dpage/pgadmin4` auf Port 5050 zur Datenbankverwaltung.